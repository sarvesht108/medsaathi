<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedSaathi</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --primary: #22c55e; --primary-dark:#16a34a;
    --text: #f1f5f9; --text-dim: #94a3b8; --border: #334155; --error: #ef4444; --warn:#f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px; border-bottom:1px solid var(--border);
    position: sticky; top: env(safe-area-inset-top,0px); background: var(--bg); z-index:5;
  }
  header h1 { font-size:18px; margin:0; color:var(--primary); }
  main { padding: 16px; padding-bottom: 90px; max-width:480px; margin:0 auto; }
  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:14px;
  }
  .med-card { margin-bottom: 14px; }
  .med-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .med-swatch {
    width:48px; height:48px; border-radius:14px; display:flex;
    align-items:center; justify-content:center; font-size:26px; flex-shrink:0;
  }
  .med-name { font-weight:700; font-size:16px; }
  .med-sub { font-size:12px; color:var(--text-dim); }
  .period-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-top:1px solid var(--border);
  }
  .period-label { display:flex; align-items:center; gap:8px; font-size:14px; }
  .period-label .picon { font-size:18px; }
  .take-btn {
    padding:8px 14px; border-radius:20px; font-size:13px; font-weight:700; border:none;
  }
  .take-btn.pending { background:#334155; color:var(--text); }
  .take-btn.taken { background: rgba(34,197,94,0.18); color: var(--primary); }
  .fab {
    position: fixed; right:20px; bottom: calc(84px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%; background:var(--primary);
    color:#052e16; font-size:28px; border:none; box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  nav.tabbar {
    position: fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--border); display:flex;
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  nav.tabbar button {
    flex:1; background:none; border:none; color:var(--text-dim);
    padding:10px 0; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.tabbar button.active { color: var(--primary); }
  nav.tabbar .icon { font-size:20px; }
  .tab-section { display:none; }
  .tab-section.active { display:block; }
  label { display:block; font-size:13px; color:var(--text-dim); margin:14px 0 8px; }
  input, select {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:15px;
  }
  button.primary {
    width:100%; margin-top:18px; padding:14px; border:none; border-radius:10px;
    background:var(--primary); color:#052e16; font-weight:700; font-size:15px;
  }
  button.danger {
    width:100%; margin-top:10px; padding:14px; border:1px solid var(--error);
    background:none; color:var(--error); border-radius:10px; font-weight:700;
  }
  .modal-bg {
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:flex-end; z-index:20;
  }
  .modal {
    background:var(--card); width:100%; border-radius:20px 20px 0 0;
    padding:20px; padding-bottom: calc(20px + env(safe-area-inset-bottom,0px));
    max-height:88vh; overflow-y:auto;
  }
  .modal h2 { margin-top:0; font-size:18px; }
  .close-x { float:right; font-size:20px; color:var(--text-dim); }
  .hidden { display:none !important; }
  .empty { text-align:center; color:var(--text-dim); padding:30px 10px; font-size:14px; }
  .profile-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
  .profile-row span:first-child { color:var(--text-dim); }

  .chip-grid { display:flex; flex-wrap:wrap; gap:10px; }
  .chip {
    flex: 1 1 auto; min-width: 70px; padding:12px 8px; border-radius:12px;
    border:2px solid var(--border); background:var(--bg); text-align:center;
    font-size:24px; cursor:pointer;
  }
  .chip.small { font-size:12px; padding:10px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .chip.selected { border-color: var(--primary); background: rgba(34,197,94,0.12); }
  .color-chip {
    width:44px; height:44px; border-radius:50%; border:3px solid var(--border); flex: 0 0 auto;
  }
  .color-chip.selected { border-color: var(--text); }
</style>
</head>
<body>

<header>
  <h1>💊 MedSaathi</h1>
  <span id="roleTag" style="font-size:12px;color:var(--text-dim);"></span>
</header>

<main>
  <section class="tab-section active" id="tab-medicines">
    <div id="medList"><div class="empty">Loading...</div></div>
  </section>

  <section class="tab-section" id="tab-history">
    <div class="card">
      <h2 style="margin-top:0;font-size:16px;">Dose History</h2>
      <div id="historyList"><div class="empty">Loading...</div></div>
    </div>
  </section>

  <section class="tab-section" id="tab-settings">
    <div class="card">
      <h2 style="margin-top:0;font-size:16px;">Settings</h2>
      <label>Notifications</label>
      <button class="primary" id="settingsNotifBtn">Notification Status Check Karein</button>
      <label>Link Code Manage Karein</label>
      <button class="primary" id="goToLinkBtn">Link Screen Kholein</button>
    </div>
  </section>

  <section class="tab-section" id="tab-profile">
    <div class="card">
      <h2 style="margin-top:0;font-size:16px;">Profile</h2>
      <div class="profile-row"><span>Naam</span><span id="pName">-</span></div>
      <div class="profile-row"><span>Role</span><span id="pRole">-</span></div>
      <div class="profile-row"><span>Phone</span><span id="pPhone">-</span></div>
      <div class="profile-row"><span>Email</span><span id="pEmail">-</span></div>
      <button class="danger" id="logoutBtn">Logout</button>
    </div>
  </section>
</main>

<button class="fab hidden" id="addMedFab">+</button>

<nav class="tabbar">
  <button class="active" data-tab="tab-medicines"><span class="icon">💊</span>Medicines</button>
  <button data-tab="tab-history"><span class="icon">📋</span>History</button>
  <button data-tab="tab-settings"><span class="icon">⚙️</span>Settings</button>
  <button data-tab="tab-profile"><span class="icon">👤</span>Profile</button>
</nav>

<div class="modal-bg hidden" id="addModal">
  <div class="modal">
    <span class="close-x" id="closeModal">✕</span>
    <h2>Nayi Dawai Add Karein</h2>
    <form id="addMedForm">

      <label>Dawai kis type ki hai?</label>
      <div class="chip-grid" id="typeChips">
        <div class="chip" data-value="💊">💊</div>
        <div class="chip" data-value="🧴">🧴</div>
        <div class="chip" data-value="💉">💉</div>
        <div class="chip" data-value="🩹">🩹</div>
      </div>

      <label>Dawai ka rang</label>
      <div class="chip-grid" id="colorChips">
        <div class="color-chip" data-value="#ef4444" style="background:#ef4444"></div>
        <div class="color-chip" data-value="#f59e0b" style="background:#f59e0b"></div>
        <div class="color-chip" data-value="#22c55e" style="background:#22c55e"></div>
        <div class="color-chip" data-value="#3b82f6" style="background:#3b82f6"></div>
        <div class="color-chip" data-value="#f1f5f9" style="background:#f1f5f9"></div>
      </div>

      <label>Kab leni hai? (ek ya zyada select karo)</label>
      <div class="chip-grid" id="periodChips">
        <div class="chip small" data-value="morning"><span class="picon">🌅</span>Subah</div>
        <div class="chip small" data-value="afternoon"><span class="picon">☀️</span>Dopahar</div>
        <div class="chip small" data-value="evening"><span class="picon">🌆</span>Shaam</div>
        <div class="chip small" data-value="night"><span class="picon">🌙</span>Raat</div>
      </div>

      <label>Naam (optional, sirf caregiver ke liye)</label>
      <input type="text" id="medName" placeholder="Jaise: Paracetamol">

      <button type="submit" class="primary">Save Karein</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, db, onAuthStateChanged } from "./firebase-config.js";
  import { signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, setDoc, collection, addDoc, query, where, getDocs,
    serverTimestamp, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const PERIODS = {
    morning:   { label: "Subah",   icon: "🌅" },
    afternoon: { label: "Dopahar", icon: "☀️" },
    evening:   { label: "Shaam",   icon: "🌆" },
    night:     { label: "Raat",    icon: "🌙" }
  };

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  let currentUser = null;
  let userData = null;
  let patientId = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "index.html"; return; }
    currentUser = user;

    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()) return;
    userData = snap.data();

    document.getElementById("roleTag").textContent =
      userData.role === "patient" ? "Patient" : "Caregiver";
    document.getElementById("pName").textContent = userData.name || "-";
    document.getElementById("pRole").textContent = userData.role || "-";
    document.getElementById("pPhone").textContent = userData.phone || "-";
    document.getElementById("pEmail").textContent = userData.email || "-";

    if (userData.role === "patient") {
      patientId = user.uid;
    } else {
      patientId = userData.linkedTo || null;
    }
    if (patientId) document.getElementById("addMedFab").classList.remove("hidden");

    loadMedicines();
    loadHistory();
  });

  document.querySelectorAll("nav.tabbar button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-section").forEach(s => s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  function setupSingleSelect(containerId) {
    const container = document.getElementById(containerId);
    container.querySelectorAll(".chip, .color-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        container.querySelectorAll(".chip, .color-chip").forEach(c => c.classList.remove("selected"));
        chip.classList.add("selected");
      });
    });
  }
  function setupMultiSelect(containerId) {
    const container = document.getElementById(containerId);
    container.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => chip.classList.toggle("selected"));
    });
  }
  setupSingleSelect("typeChips");
  setupSingleSelect("colorChips");
  setupMultiSelect("periodChips");

  async function loadMedicines() {
    const listEl = document.getElementById("medList");
    if (!patientId) {
      listEl.innerHTML = '<div class="card"><div class="empty">Abhi kisi patient se link nahi hain. Settings mein jaake link karein.</div></div>';
      return;
    }
    const q = query(collection(db, "medicines"), where("patientId", "==", patientId));
    const results = await getDocs(q);
    if (results.empty) {
      listEl.innerHTML = '<div class="card"><div class="empty">Koi dawai add nahi ki gayi hai abhi</div></div>';
      return;
    }
    listEl.innerHTML = "";
    const today = todayStr();

    for (const docSnap of results.docs) {
      const m = docSnap.data();
      const medId = docSnap.id;
      const wrap = document.createElement("div");
      wrap.className = "card med-card";

      let periodsHtml = "";
      for (const p of (m.periods || [])) {
        const info = PERIODS[p] || { label: p, icon: "⏰" };
        periodsHtml += `
          <div class="period-row">
            <div class="period-label"><span class="picon">${info.icon}</span> ${info.label}</div>
            <button class="take-btn pending" data-med="${medId}" data-period="${p}">Le Li</button>
          </div>
        `;
      }

      wrap.innerHTML = `
        <div class="med-head">
          <div class="med-swatch" style="background:${m.color || '#334155'}22;border:2px solid ${m.color || '#334155'}">${m.icon || "💊"}</div>
          <div>
            <div class="med-name">${m.medicineName || "Dawai"}</div>
            <div class="med-sub">${(m.periods || []).length} baar din mein</div>
          </div>
        </div>
        ${periodsHtml}
      `;
      listEl.appendChild(wrap);

      for (const p of (m.periods || [])) {
        const logId = `${medId}_${p}_${today}`;
        const logSnap = await getDoc(doc(db, "doseLogs", logId));
        const btn = wrap.querySelector(`button[data-med="${medId}"][data-period="${p}"]`);
        if (logSnap.exists() && logSnap.data().status === "taken") {
          btn.textContent = "Li Gayi ✓";
          btn.classList.remove("pending");
          btn.classList.add("taken");
        }
        btn.addEventListener("click", async () => {
          await setDoc(doc(db, "doseLogs", logId), {
            medicineId: medId,
            patientId,
            period: p,
            dateStr: today,
            status: "taken",
            takenAt: serverTimestamp()
          });
          btn.textContent = "Li Gayi ✓";
          btn.classList.remove("pending");
          btn.classList.add("taken");
        });
      }
    }
  }

  async function loadHistory() {
    const listEl = document.getElementById("historyList");
    if (!patientId) {
      listEl.innerHTML = '<div class="empty">Link hone ke baad history dikhegi</div>';
      return;
    }
    try {
      const q = query(
        collection(db, "doseLogs"),
        where("patientId", "==", patientId),
        orderBy("takenAt", "desc"),
        limit(20)
      );
      const results = await getDocs(q);
      if (results.empty) {
        listEl.innerHTML = '<div class="empty">Abhi koi history nahi hai</div>';
        return;
      }
      listEl.innerHTML = "";
      results.forEach(docSnap => {
        const d = docSnap.data();
        const info = PERIODS[d.period] || { label: d.period, icon: "⏰" };
        const row = document.createElement("div");
        row.className = "period-row";
        row.innerHTML = `
          <div class="period-label"><span class="picon">${info.icon}</span> ${info.label} • ${d.dateStr}</div>
          <span class="take-btn taken">Li Gayi</span>
        `;
        listEl.appendChild(row);
      });
    } catch (e) {
      listEl.innerHTML = '<div class="empty">History load nahi ho payi</div>';
    }
  }

  const addModal = document.getElementById("addModal");
  document.getElementById("addMedFab").addEventListener("click", () => {
    addModal.classList.remove("hidden");
  });
  document.getElementById("closeModal").addEventListener("click", () => {
    addModal.classList.add("hidden");
  });

  document.getElementById("addMedForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const typeSel = document.querySelector("#typeChips .selected");
    const colorSel = document.querySelector("#colorChips .selected");
    const periodSels = document.querySelectorAll("#periodChips .selected");
    const medicineName = document.getElementById("medName").value.trim();

    if (!typeSel || !colorSel || periodSels.length === 0) {
      alert("Type, rang, aur kam se kam ek time period select karein");
      return;
    }

    const periods = Array.from(periodSels).map(el => el.dataset.value);

    await addDoc(collection(db, "medicines"), {
      patientId,
      icon: typeSel.dataset.value,
      color: colorSel.dataset.value,
      periods,
      medicineName: medicineName || "",
      createdAt: serverTimestamp()
    });

    addModal.classList.add("hidden");
    document.getElementById("addMedForm").reset();
    document.querySelectorAll(".chip, .color-chip").forEach(c => c.classList.remove("selected"));
    loadMedicines();
  });

  document.getElementById("settingsNotifBtn").addEventListener("click", () => {
    alert("Notification status: " + (window.Notification ? Notification.permission : "not supported"));
  });
  document.getElementById("goToLinkBtn").addEventListener("click", () => {
    window.location.href = "permissions.html";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });
</script>
</body>
</html>
